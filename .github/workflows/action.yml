
name: OpenCode Cloud Terminal

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  opencode:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ttyd curl

      - name: Install OpenCode
        run: |
          curl -fsSL https://opencode.ai/install | bash

          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"

      - name: Install Cloudflared
        run: |
          curl -fsSL \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 \
            -o cloudflared

          chmod +x cloudflared
          sudo mv cloudflared /usr/local/bin/cloudflared

      - name: Start OpenCode and Cloudflare Tunnel
        env:
          TTYD_PASSWORD: ${{ secrets.TTYD_PASSWORD }}
        run: |
          set -euo pipefail

          # Verify installation.
          command -v opencode
          opencode --version
          ttyd --version
          cloudflared --version

          if [ -z "$TTYD_PASSWORD" ]; then
            echo "Missing TTYD_PASSWORD repository secret."
            exit 1
          fi

          export TERM=xterm-256color
          export COLORTERM=truecolor

          # Start OpenCode inside a real pseudo-terminal.
          ttyd \
            --writable \
            --port 7681 \
            --credential "opencode:${TTYD_PASSWORD}" \
            --terminal-type xterm-256color \
            script -q -c "opencode" /dev/null &

          TTYD_PID=$!

          # Start Cloudflare Quick Tunnel.
          cloudflared tunnel \
            --url http://localhost:7681 \
            --no-autoupdate \
            > cloudflared.log 2>&1 &

          TUNNEL_PID=$!

          # Wait for Cloudflare to generate a public URL.
          URL=""

          echo "Waiting for Cloudflare tunnel..."

          for i in $(seq 1 60); do
            URL=$(grep -oE \
              'https://[a-zA-Z0-9-]+\.trycloudflare\.com' \
              cloudflared.log | head -n 1 || true)

            if [ -n "$URL" ]; then
              break
            fi

            if ! kill -0 "$TUNNEL_PID" 2>/dev/null; then
              echo "Cloudflare exited unexpectedly."
              cat cloudflared.log
              exit 1
            fi

            sleep 2
          done

          if [ -z "$URL" ]; then
            echo "Failed to obtain Cloudflare URL."
            cat cloudflared.log
            exit 1
          fi

          # Display connection information.
          echo ""
          echo "=========================================="
          echo "OpenCode Cloud Terminal is ready!"
          echo "=========================================="
          echo "URL: $URL"
          echo "Username: opencode"
          echo "Password: your TTYD_PASSWORD secret"
          echo "=========================================="
          echo ""

          # Keep the workflow alive while both services run.
          while true; do
            if ! kill -0 "$TTYD_PID" 2>/dev/null; then
              echo "ttyd stopped unexpectedly."
              break
            fi

            if ! kill -0 "$TUNNEL_PID" 2>/dev/null; then
              echo "Cloudflare stopped unexpectedly."
              break
            fi

            sleep 5
          done

          # Print diagnostic logs.
          echo ""
          echo "========== CLOUDFLARE LOGS =========="
          cat cloudflared.log

          echo ""
          echo "========== PROCESS STATUS =========="
          ps aux

          exit 1
