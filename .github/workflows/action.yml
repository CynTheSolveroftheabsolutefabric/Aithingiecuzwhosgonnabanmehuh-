
name: OpenCode Cloud Terminal

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  opencode:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ttyd curl

      - name: Install OpenCode
        run: |
          curl -fsSL https://opencode.ai/install | bash

          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"

      - name: Install Cloudflared
        run: |
          curl -fsSL \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 \
            -o cloudflared

          chmod +x cloudflared
          sudo mv cloudflared /usr/local/bin/cloudflared

      - name: Start OpenCode and Cloudflare Tunnel
        env:
          TTYD_PASSWORD: ${{ secrets.TTYD_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "$TTYD_PASSWORD" ]; then
            echo "Missing TTYD_PASSWORD repository secret."
            exit 1
          fi

          export TERM=xterm-256color
          export COLORTERM=truecolor

          # Start OpenCode in a writable web terminal.
          ttyd \
            --writable \
            --port 7681 \
            --credential "opencode:${TTYD_PASSWORD}" \
            --terminal-type xterm-256color \
            bash -lc 'exec opencode' &

          TTYD_PID=$!

          # Start Cloudflare Quick Tunnel.
          cloudflared tunnel \
            --url http://localhost:7681 \
            --no-autoupdate \
            > cloudflared.log 2>&1 &

          TUNNEL_PID=$!

          # Wait for the public URL.
          echo "Waiting for Cloudflare tunnel..."

          URL=""

          for i in $(seq 1 60); do
            URL=$(grep -oE \
              'https://[a-zA-Z0-9-]+\.trycloudflare\.com' \
              cloudflared.log | head -n 1 || true)

            if [ -n "$URL" ]; then
              break
            fi

            if ! kill -0 "$TUNNEL_PID" 2>/dev/null; then
              echo "Cloudflare tunnel stopped unexpectedly."
              cat cloudflared.log
              exit 1
            fi

            sleep 2
          done

          if [ -z "$URL" ]; then
            echo "Failed to obtain Cloudflare URL."
            cat cloudflared.log
            exit 1
          fi

          echo ""
          echo "======================================"
          echo "OpenCode is available at:"
          echo "$URL"
          echo "======================================"
          echo ""
          echo "Username: opencode"
          echo "Password: configured in TTYD_PASSWORD"
          echo ""
          echo "Terminal is running."

          # Keep the job alive while both processes are running.
          while kill -0 "$TTYD_PID" 2>/dev/null && \
                kill -0 "$TUNNEL_PID" 2>/dev/null; do
            sleep 5
          done

          echo "OpenCode or Cloudflare stopped."

          kill "$TTYD_PID" "$TUNNEL_PID" 2>/dev/null || true

          exit 1
